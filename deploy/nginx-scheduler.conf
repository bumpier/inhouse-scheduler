# Inhouse Scheduler — nginx vhost
# Install:  sudo cp deploy/nginx-scheduler.conf /etc/nginx/sites-available/scheduler
#           sudo ln -s /etc/nginx/sites-available/scheduler /etc/nginx/sites-enabled/
#           sudo nginx -t && sudo systemctl reload nginx
#           sudo certbot --nginx -d scheduler.shifalabsops.com     # adds the TLS block

server {
    listen 80;
    listen [::]:80;
    server_name scheduler.shifalabsops.com;

    # Videos are large. nginx defaults to 1 MB, which would reject every upload.
    client_max_body_size 1G;

    # Stream uploads straight through instead of buffering the whole file first.
    proxy_request_buffering off;
    proxy_buffering off;

    proxy_read_timeout    600s;
    proxy_send_timeout    600s;
    client_body_timeout   600s;

    location / {
        # MUST match APP_PORT in .env, and that port MUST be verified free first.
        # 3000 and 3001 are already used by other services on this box.
        # Pointing this at an occupied port publishes that service to the internet.
        proxy_pass http://127.0.0.1:CHANGE_ME;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
    }
}
