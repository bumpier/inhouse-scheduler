services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-scheduler}
      POSTGRES_DB: scheduler
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scheduler:${POSTGRES_PASSWORD:-scheduler}@db:5432/scheduler
    command: ["npx", "prisma", "db", "push", "--skip-generate"]
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scheduler:${POSTGRES_PASSWORD:-scheduler}@db:5432/scheduler
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Bound to localhost only: the host's nginx proxies to it.
    # Do NOT change this to "3000:3000" — Docker writes its own iptables rules
    # and would expose the app to the internet even if ufw says otherwise.
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  worker:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://scheduler:${POSTGRES_PASSWORD:-scheduler}@db:5432/scheduler
      UPLOAD_DIR: /data/uploads
    volumes:
      - uploads:/data/uploads
    command: ["node", "dist/worker/index.js"]
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
  uploads:
